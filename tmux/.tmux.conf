# prefix is Ctrl+b (default)
set-option -g prefix C-b
bind-key C-b send-prefix

# Inside tmux TERM must be a tmux description (tmux FAQ); programs then talk to tmux,
# which translates for Ghostty. The RGB feature tells tmux the outer terminal does
# true colour.
set -g default-terminal "tmux-256color"
set -as terminal-features 'xterm-ghostty:RGB'

set-option -sg escape-time 10

# Extended keys so tmux can distinguish Ctrl+Shift+H from Ctrl+h, and Shift+Enter from
# Enter (Claude Code's newline key).
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# scroll back (default is 2000)
set-option -g history-limit 50000

# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Closing a window closes the gap in the numbering, so the bar never reads "1 3 4".
set -g renumber-windows on

# Killing the last window of a session moves to another session instead of exiting tmux.
set -g detach-on-destroy off

# New windows and splits open in the current pane's directory. | and - are the
# mnemonic splits; " and % do the same for muscle memory.
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Reading measure. A full-width pane here is ~212 columns; prose wrapped that wide
# is roughly three times the length the eye tracks reliably. This parks the current
# pane at ~100 columns by opening a shell beside it, keeping focus where it was.
bind C-r split-window -h -d -l 52% -c "#{pane_current_path}"

# reload config file
bind r source-file ~/.tmux.conf

# switch panes using prefix + hjkl
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# Move panes between windows. Capitals, so j keeps pane navigation and s keeps
# tmux's session picker.
bind J command-prompt -p "join pane from:" "join-pane -s '%%'"
bind S command-prompt -p "send pane to:" "join-pane -t '%%'"

# auto-rename windows based on running command
set-option -g automatic-rename on

# Claude Code's binary is its version number (~/.local/bin/claude -> versions/2.1.211),
# so the bare command name renames the window on every update. Match any version-shaped
# command back to "claude".
set-option -g automatic-rename-format \
  '#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},claude,#{pane_current_command}}'

# The Ghostty "side session" (see zshrc) attaches a second grouped session to "main" so
# each screen can sit on its own window. Without this, window-size's default "latest" mode
# sizes a shared window using any attached session in the group, so switching windows on
# one screen resizes/reflows whatever the other screen is currently looking at. Scoping
# resize to sessions for which the window is actually current keeps the two independent.
set-window-option -g aggressive-resize on

set -g mouse on

# Lets image.nvim's Kitty graphics and Claude Code's notifications reach Ghostty.
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Enable focus reporting (recommended by Claude Code)
set -g focus-events on

# Vim keys in copy mode (prefix-[): v selects, C-v toggles block selection.
# y and mouse-drag copying to the clipboard come from tmux-yank.
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Colours are palette names, never hex: tmux resolves them through the terminal's palette,
# so Ghostty's theme decides what "blue" looks like and a theme change there needs no edit
# here. The bar is just the window list: transparent, nothing left or right.
# status-right is empty but must stay set before tpm: continuum appends its autosave hook
# to it on load, and anything that overwrites it afterwards silently stops the saves.
set -g status-position top
set -g status-style 'bg=default'
set -g status-left ''
set -g status-right ''
set -g window-status-format '#[fg=brightblack]#I #W'
set -g window-status-current-format '#[fg=blue,bold]#I #W'
set -g window-status-separator '   '

# Use single-line borders (heavy causes rendering gaps in Ghostty)
set -g pane-border-lines single

# A bare rule above each pane, dividing the bar from the content. No format text.
set -g pane-border-status top
set -g pane-border-format ''
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=blue'
set -g message-style 'fg=default,bg=default'
set -g message-command-style 'fg=default,bg=default'
set -g mode-style 'reverse'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# continuum saves every 15 minutes and restores the last save when the tmux server starts.
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
