# prefix is Ctrl+b (default)
set-option -g prefix C-b
bind-key C-b send-prefix

# Use Ghostty's terminfo for proper rendering
set -g default-terminal "xterm-ghostty"
set -as terminal-features 'xterm-ghostty:RGB'

# Pass Alt/Meta keys through to applications (e.g. Neovim)
set-option -g xterm-keys on
set-option -sg escape-time 10

# Extended keys so tmux can distinguish Ctrl+Shift+H from Ctrl+h
set -s extended-keys on
set -as terminal-features 'xterm-ghostty:extkeys'

# scroll back (default is 2000)
set-option -g history-limit 50000

# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows prompt for a name straight away, since several windows run the same
# command and would otherwise all read "claude". An empty name would otherwise stick as
# a blank, so it hands the window back to automatic-rename instead.
# %1 rather than %%: tmux only substitutes the first %%, leaving later ones literal.
bind c new-window -c "#{pane_current_path}" \; \
  command-prompt -p "window name:" \
    "if-shell -F '#{==:%1,}' 'setw automatic-rename on' 'rename-window -- \"%1\"'"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Reading measure. A full-width pane here is ~212 columns; prose wrapped that wide
# is roughly three times the length the eye tracks reliably. This parks the current
# pane at ~100 columns by opening a shell beside it, keeping focus where it was.
bind C-r split-window -h -d -l 52% -c "#{pane_current_path}"

# reload config file
bind r source-file ~/.tmux.conf

# switch windows using prefix + n/p (Ctrl+B then n or p)

# switch panes using prefix + hjkl
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# switch windows using Alt-Shift-H/L (replaced arrow keys above)
# bind -n M-S-Left previous-window
# bind -n M-S-Right next-window

# auto-rename windows based on running command
set-option -g automatic-rename on

# Claude Code's binary is its version number (~/.local/bin/claude -> versions/2.1.211),
# so the bare command name renames the window on every update. Match any version-shaped
# command back to "claude".
set-option -g automatic-rename-format \
  '#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},claude,#{pane_current_command}}'

# The Ghostty "side session" (see zshrc) attaches a second grouped session to "main" so
# each screen can sit on its own window. Without this, window-size's default "latest" mode
# sizes a shared window using any attached session in the group, so switching windows on
# one screen resizes/reflows whatever the other screen is currently looking at. Scoping
# resize to sessions for which the window is actually current keeps the two independent.
set-window-option -g aggressive-resize on

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# Allow Kitty graphics protocol passthrough (for image.nvim)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Mouse drag selection copies to clipboard (macOS)
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Shift+Enter for multiline input in Claude Code
bind -n S-Enter send-keys Escape "[13;2u"

# A bare rule above each pane, purely to separate the status bar from the content.
# No format text: the directory it used to show is already in status-right.
set -g pane-border-status top
set -g pane-border-format ''

# Border colours come from the rose-pine plugin at the tpm line below; setting
# them here would be silently overridden.

# Use single-line borders (heavy causes rendering gaps in Ghostty)
set -g pane-border-lines single

# # add panel thingy title
# bind '`' run-shell 'ps --forest -o pid,args -g #{pane_pid}'
# set -g pane-border-status top
# set -g pane-border-format ' #(pwd="#{pane_current_path}"; echo ${pwd####*/}) ⌁ ${pane_current_command} '

# move a pane?
bind-key j command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:"  "join-pane -t '%%'"

#
# set-window-option -g mode-keys vi
# bind-key -T copy-mode-vi v   send-keys -X begin-selection
# bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# bind-key -T copy-mode-vi y   send-keys -X copy-selection

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'rose-pine/tmux'

set-option -g status on
set-option -g status-position top

# bar_bg_disable lets the terminal's transparency show through the status bar
set -g @rose_pine_variant 'moon'
set -g @rose_pine_bar_bg_disable 'on'
set -g @rose_pine_bar_bg_disabled_color_option 'default'
set -g @rose_pine_directory 'on'
set -g @rose_pine_show_current_program 'on'
set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_date_time ''

# The window list is built by hand below the tpm line, so rose-pine's own window format
# options would have no effect and are deliberately absent.

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Enable focus reporting (recommended by Claude Code)
set -g focus-events on

# Must come after tpm: rose-pine sets status-left itself, as session name + icon. The
# session is always the same one, so the only signal left is the prefix state: a dot that
# shows only while the prefix is pending. Both branches are 2 cols so the bar never shifts.
set -g status-left '#{?client_prefix,#[fg=#eb6f92]● ,  }'

# Also after tpm: rose-pine hardcodes gold for the active window and border, and exposes
# no option to change it. Swapped for foam, the blue of matching weight.
#
# The active window is a filled pill.  and  are the powerline half-circle caps,
# drawn as foam *text* on bg=default: transparency only applies to backgrounds, so a cap
# filled via bg would punch an opaque square through the wallpaper instead of a curve.
set -g window-status-current-style "fg=#232136,bg=default"
set -g window-status-current-format "#[fg=#9ccfd8,bg=default]#[fg=#232136,bg=#9ccfd8,bold] #I: #W #[fg=#9ccfd8,bg=default,nobold]"

# Inactive windows keep rose-pine's iris, but carry their own padding: the separator is
# gone, since the pill's caps are what space the active window from its neighbours.
set -g window-status-format "#[fg=#c4a7e7]  #I: #W  "
set -g window-status-separator ""

set -g pane-active-border-style 'fg=#9ccfd8'
