# AeroSpace Tiling Window Manager Configuration
# Reload: alt-shift-c

# General settings
start-at-login = true

after-login-command = []

after-startup-command = [
  'layout tiles horizontal',
  'exec-and-forget borders'
]

# On workspace change: see ~/.config/aerospace/on-workspace-change.sh
exec-on-workspace-change = ['/bin/bash', '-c', '"$HOME"/.config/aerospace/on-workspace-change.sh']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Gaps
[gaps]
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8
inner.horizontal = 6
inner.vertical = 6

# Main mode keybindings
[mode.main.binding]

# Focus (vim hjkl)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Switch to workspace
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

# Move window to workspace (trigger both target + focused workspace icon updates)
alt-shift-1 = ['move-node-to-workspace 1', 'exec-and-forget "$HOME"/.config/aerospace/after-move.sh 1']
alt-shift-2 = ['move-node-to-workspace 2', 'exec-and-forget "$HOME"/.config/aerospace/after-move.sh 2']
alt-shift-3 = ['move-node-to-workspace 3', 'exec-and-forget "$HOME"/.config/aerospace/after-move.sh 3']
alt-shift-4 = ['move-node-to-workspace 4', 'exec-and-forget "$HOME"/.config/aerospace/after-move.sh 4']
alt-shift-5 = ['move-node-to-workspace 5', 'exec-and-forget "$HOME"/.config/aerospace/after-move.sh 5']
alt-shift-6 = ['move-node-to-workspace 6', 'exec-and-forget "$HOME"/.config/aerospace/after-move.sh 6']
alt-shift-7 = ['move-node-to-workspace 7', 'exec-and-forget "$HOME"/.config/aerospace/after-move.sh 7']
alt-shift-8 = ['move-node-to-workspace 8', 'exec-and-forget "$HOME"/.config/aerospace/after-move.sh 8']
alt-shift-9 = ['move-node-to-workspace 9', 'exec-and-forget "$HOME"/.config/aerospace/after-move.sh 9']
alt-shift-0 = ['move-node-to-workspace 10', 'exec-and-forget "$HOME"/.config/aerospace/after-move.sh 10']

# Layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-f = 'fullscreen'
alt-shift-f = 'layout floating tiling'

# Multi-monitor
alt-tab = 'workspace-back-and-forth'
alt-m = 'focus-monitor --wrap-around next'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
alt-shift-ctrl-h = 'move-node-to-monitor left'
alt-shift-ctrl-l = 'move-node-to-monitor right'

# Utility
alt-shift-c = 'reload-config'
alt-shift-semicolon = 'mode service'
alt-shift-q = 'close'

# Enter resize mode
alt-r = 'mode resize'

# Enter open (app launcher) mode
alt-o = 'mode open'

# Resize mode
[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
esc = 'mode main'

# Service mode (AeroSpace default): one key, then back to main
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# Open (app launcher) mode
[mode.open.binding]
g = ['exec-and-forget open -a Ghostty', 'mode main']
b = ['exec-and-forget open -a "Google Chrome"', 'mode main']
m = ['exec-and-forget open -a Mattermost', 'mode main']
z = ['exec-and-forget open -a Zed', 'mode main']
f = ['exec-and-forget open -a Finder', 'mode main']
esc = 'mode main'

# Workspace-to-monitor assignment
[workspace-to-monitor-force-assignment]
# Monitors are numbered left to right in System Settings > Displays, the laptop sorts last.
# 10 takes a lone external, or the second from the left with two; 9 takes the leftmost.
# shortcut: with one external 9 shares it with 10, the pattern language cannot count monitors
10 = ['secondary', 2, 'main']
9 = [1, 'main']

# App-specific rules: float system popups
[[on-window-detected]]
if.app-id = 'com.apple.finder'
if.window-title-regex-substring = 'Info$'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.archiveutility'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Shortcuts'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.AirDrop'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ScreenSharing'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.keychainaccess'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ColorSyncUtility'
run = 'layout floating'
