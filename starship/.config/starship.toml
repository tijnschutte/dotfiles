# Starship prompt, nerd-font-symbols preset with local tweaks on top.
# Docs: https://starship.rs/config/   Regenerate base: starship preset nerd-font-symbols
#
# Tables below that also exist in the preset (aws, conda, directory, git_branch,
# hostname, python) are merged here, because TOML rejects a table defined twice.

"$schema" = 'https://starship.rs/config-schema.json'

# Minimal two-liner:
#   dotfiles on  master (env)
#   ❯
# Modules not listed here never render, so new tools stay off the line until
# added explicitly.
format = "$directory$git_branch$conda$python$cmd_duration$line_break$character"
add_newline = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
# \uF418 is the Nerd Font git-branch glyph, written as an escape so editors
# that cannot display private-use characters do not silently drop it.
symbol = "\uF418 "

# Shown by Starship instead of conda's own "(env) " prefix; see ~/.condarc.
[conda]
symbol = ""
format = '([\($environment\)]($style) )'

# Only the venv name, no interpreter version.
[python]
format = '([\($virtualenv\)]($style) )'

# Shows how long the last command took when it exceeds 2s.
[cmd_duration]
min_time = 2_000
format = "took [$duration]($style) "

# Region comes from ~/.aws/config, not the project, so it would show on every prompt.
[aws]
disabled = true

[hostname]
ssh_symbol = " "

